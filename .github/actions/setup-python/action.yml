name: 'Setup Python'
description: 'Install Python and project dependencies for Janus backend'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  deploy-key:
    description: 'SSH deploy key for accessing private GitHub dependencies'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Configure SSH for private dependencies
      if: inputs.deploy-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.deploy-key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
        printf 'Host github.com\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
        chmod 600 ~/.ssh/config
        git config --global url."git@github.com:".insteadOf "https://github.com/"

    - name: Install dependencies
      shell: bash
      run: |
        cd backend
        pip install -e ".[dev]"
