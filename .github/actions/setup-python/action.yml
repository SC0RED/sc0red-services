name: 'Setup Python'
description: 'Install Python and project dependencies for Janus backend'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        cd backend
        pip install -e ".[dev]"
