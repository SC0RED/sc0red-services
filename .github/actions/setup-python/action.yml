name: 'Setup Python'
description: 'Install Python and project dependencies for Janus backend'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  app-id:
    description: 'GitHub App ID for generating installation token'
    required: false
    default: ''
  app-private-key:
    description: 'GitHub App private key for generating installation token'
    required: false
    default: ''
  deploy-key:
    description: 'SSH private key for accessing private GitHub dependencies (fallback when App token unavailable)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Generate GitHub App token
      id: app-token
      if: inputs.app-id != '' && inputs.app-private-key != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: SC0RED

    - name: Configure git via GitHub App token
      if: steps.app-token.outcome == 'success'
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Configure git via SSH deploy key
      if: steps.app-token.outcome != 'success' && inputs.deploy-key != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.deploy-key }}" > ~/.ssh/janus_deploy_key
        chmod 600 ~/.ssh/janus_deploy_key
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
        cat >> ~/.ssh/config << 'EOF'
        Host github.com
          IdentityFile ~/.ssh/janus_deploy_key
          StrictHostKeyChecking yes
        EOF
        chmod 600 ~/.ssh/config
        git config --global url."git@github.com:".insteadOf "https://github.com/"

    - name: Install dependencies
      shell: bash
      run: |
        cd backend
        pip install -e ".[dev]"
