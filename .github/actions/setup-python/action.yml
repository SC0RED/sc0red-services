name: 'Setup Python'
description: 'Install Python and project dependencies for Janus backend'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  gh-pat:
    description: 'GitHub PAT for cloning private dependencies (signalfield-core)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Configure git for private dependencies
      shell: bash
      run: |
        TOKEN="${GH_PAT:-${GITHUB_TOKEN}}"
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      env:
        GH_PAT: ${{ inputs.gh-pat }}
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install dependencies
      shell: bash
      run: |
        cd backend
        pip install -e ".[dev]"
