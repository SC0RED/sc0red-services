name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "CDK environment name (staging, testing, production)"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true
      DEPLOY_KEY:
        required: true
      AMPLIFY_GITHUB_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: |
          cd infrastructure
          uv sync --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Bootstrap
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=${{ inputs.environment }} \
            cdk bootstrap "aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ secrets.AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=${{ inputs.environment }} \
          AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}" \
            cdk deploy Janus-${{ inputs.environment }} \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=${{ inputs.environment }}" \
              --context "account=${{ secrets.AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.AWS_REGION }}"

      - name: Print deployment outputs
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-${{ inputs.environment }}', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "
