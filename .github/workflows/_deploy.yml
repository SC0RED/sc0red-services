name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "CDK environment name (staging, testing, production)"
      aws_prefix:
        required: true
        type: string
        description: "Secret name prefix for AWS creds (DEV, TEST, PROD)"
    secrets:
      DEPLOY_KEY:
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: |
          cd infrastructure
          uv sync --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', inputs.aws_prefix)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', inputs.aws_prefix)] }}
          aws-region: ${{ secrets[format('{0}_AWS_REGION', inputs.aws_prefix)] }}

      - name: CDK Bootstrap
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=${{ inputs.environment }} \
            cdk bootstrap "aws://${{ secrets[format('{0}_AWS_ACCOUNT_ID', inputs.aws_prefix)] }}/${{ secrets[format('{0}_AWS_REGION', inputs.aws_prefix)] }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets[format('{0}_OPENAI_API_KEY', inputs.aws_prefix)] }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=${{ inputs.environment }} \
          AWS_DEFAULT_REGION="${{ secrets[format('{0}_AWS_REGION', inputs.aws_prefix)] }}" \
            cdk deploy Janus-${{ inputs.environment }} \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=${{ inputs.environment }}" \
              --context "account=${{ secrets[format('{0}_AWS_ACCOUNT_ID', inputs.aws_prefix)] }}" \
              --context "region=${{ secrets[format('{0}_AWS_REGION', inputs.aws_prefix)] }}"

      - name: Print deployment outputs
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-${{ inputs.environment }}', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "
