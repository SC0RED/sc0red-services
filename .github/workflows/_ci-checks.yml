name: Reusable CI Checks

on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Run tests
        run: make test

  frontend-test:
    runs-on: ubuntu-latest
    name: Frontend Test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: Run tests
        run: cd frontend && npm test
      - name: Run coverage
        run: cd frontend && npx vitest run --coverage
      - name: Verify help-content registry mirror
        # Fails if `frontend/src/lib/help-content.ts` and
        # `docs/help-content.md` disagree on title/body for any term.
        # See `scripts/check-help-content.mjs`.
        run: cd frontend && npm run check:help-content
      - name: Verify pdf-render token.ts is in lockstep with frontend
        # The Lambda's token.ts is a verbatim copy of frontend's; CI fails
        # the diff so the two never silently drift on the wire format.
        # `npm run sync-token` (inside backend/lambdas/pdf-render) is the
        # canonical way to update the Lambda's copy.
        run: diff -q frontend/src/lib/pdf/token.ts backend/lambdas/pdf-render/src/token.ts

  audit:
    runs-on: ubuntu-latest
    name: Audit
    steps:
      - uses: actions/checkout@v4
      - name: Run codebase audit
        run: ./scripts/audit.sh

  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Run security checks
        run: make security
