name: Reusable CI Checks

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
      GH_PAT:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          gh-pat: ${{ secrets.GH_PAT }}
      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          gh-pat: ${{ secrets.GH_PAT }}
      - name: Run tests
        run: make test

  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
        with:
          gh-pat: ${{ secrets.GH_PAT }}
      - name: Run security checks
        run: make security
