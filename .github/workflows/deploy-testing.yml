name: Deploy Testing

on:
  workflow_dispatch:
  push:
    branches:
      - testing
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'scripts/e2e-cleanup.py'
      - '.github/workflows/deploy-testing.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Deploy to Testing
    needs: ci
    runs-on: ubuntu-latest
    # Typical run is ~7 min. 20-min ceiling matches deploy-backend.yml
    # so a stuck-queued runner fails fast instead of leaving the job
    # hanging for 6h (GitHub Actions default).
    timeout-minutes: 20
    environment: testing
    permissions:
      contents: read
    outputs:
      frontend_url: ${{ steps.outputs.outputs.frontend_url }}
      # NOTE: we used to expose `user_pool_id` here, but Cognito User Pool
      # IDs are formatted as `<region>_xxxxx`, and the region prefix gets
      # masked because `TEST_AWS_REGION` is stored as a GitHub secret.
      # GitHub Actions then refuses to pass the masked value through
      # `needs.deploy.outputs` ("Skip output 'user_pool_id' since it may
      # contain secret"), silently skipping the cleanup job. The cleanup
      # job now uses the script's auto-discovery (`discover_user_pool_id`
      # in `scripts/e2e-cleanup.py`) instead of crossing this output.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: cd infrastructure && uv sync --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.TEST_AWS_REGION }}

      - name: CDK Bootstrap
        env:
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=testing \
            cdk bootstrap "aws://${{ secrets.TEST_AWS_ACCOUNT_ID }}/${{ secrets.TEST_AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=testing \
          AWS_DEFAULT_REGION="${{ secrets.TEST_AWS_REGION }}" \
            cdk deploy Janus-testing \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=testing" \
              --context "account=${{ secrets.TEST_AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.TEST_AWS_REGION }}"

      - name: Extract deployment outputs
        id: outputs
        run: |
          python3 -c "
          import json, sys, os
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-testing', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
                          gh.write(f'frontend_url={val}\n')
                  # `user_pool_id` is intentionally NOT exported to
                  # GITHUB_OUTPUT — see the comment on the deploy job's
                  # `outputs:` block. Cleanup auto-discovers from Cognito.
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "

  e2e:
    name: E2E Tests
    needs: deploy
    if: needs.deploy.outputs.frontend_url != ''
    runs-on: ubuntu-latest
    environment: testing
    # Typical run is ~5-6 min (Playwright browser install + full deployed
    # suite). 20-min ceiling absorbs the slower 3-retry path on flaky
    # assertions while still failing fast on a stuck-queued runner.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run deployed E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.frontend_url }}
        run: |
          cd frontend && npx playwright test \
            --project=deployed \
            --project=deployed-post-scan \
            --project=deployed-cleanup

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: frontend/playwright-report/

  cleanup:
    name: Cleanup Test Data
    needs: [deploy, e2e]
    # Run on any deploy outcome — accumulated e2e users need cleanup
    # whether or not the most recent deploy succeeded. Auto-discovery
    # in `e2e-cleanup.py` exits cleanly if the pool isn't found (e.g.,
    # the very first deploy where the stack doesn't exist yet).
    if: always()
    runs-on: ubuntu-latest
    # Cleanup is a single boto3 script (~15-30 s). 5-min ceiling
    # matches deploy-backend.yml.
    timeout-minutes: 5
    environment: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.TEST_AWS_REGION }}

      - name: Run cleanup script
        # No --user-pool-id: the script auto-discovers via the
        # `janus-users-*` name pattern. Avoids the secret-masking issue
        # with cross-job outputs that previously skipped this step.
        run: |
          python3 scripts/e2e-cleanup.py \
            --table janus-testing \
            --region "${{ secrets.TEST_AWS_REGION }}"
