name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-production.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Deploy to Production
    needs: ci
    # arm64 runner so CDK's Docker bundling builds aarch64 wheels natively for
    # the arm64 production Lambdas (production lambda_architecture=arm64). The
    # bundle platform is also pinned in build_bundling_options.
    runs-on: ubuntu-24.04-arm
    # Typical run is ~10 min. 25-min ceiling matches deploy-backend.yml /
    # deploy-testing.yml proportions; production CDK deploys are slightly
    # heavier so we add 5 min headroom. Fails fast if a runner gets stuck
    # in the queue instead of leaving the job hanging for 6h.
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: cd infrastructure && uv sync --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}

      - name: CDK Bootstrap
        env:
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=production \
            cdk bootstrap "aws://${{ secrets.PROD_AWS_ACCOUNT_ID }}/${{ secrets.PROD_AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PROD_OPENAI_API_KEY was missing until 2026-07-23, which made every
          # backend invocation fail-fast (502) from the 6/30 deploy onward. The
          # secret now exists, and lambda_factory.py fails the synth if openai
          # is ever requested without a key again.
          OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=production \
          AWS_DEFAULT_REGION="${{ secrets.PROD_AWS_REGION }}" \
            cdk deploy Sc0redServices-production \
              --require-approval never \
              --outputs-file /tmp/sc0red-services-outputs.json \
              --context "environment=production" \
              --context "account=${{ secrets.PROD_AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.PROD_AWS_REGION }}"

      - name: Print deployment outputs
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/tmp/sc0red-services-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Sc0redServices-production', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "
