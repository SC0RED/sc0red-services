name: Deploy Production

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/_deploy.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Production
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.PROD_AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.PROD_AWS_REGION }}
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}
      AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
      OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
