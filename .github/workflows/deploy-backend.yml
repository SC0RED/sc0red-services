name: Deploy Development

on:
  push:
    branches:
      - development
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: cd infrastructure && uv sync --quiet

      - name: Debug AWS secrets
        run: |
          KEY="${{ secrets.DEV_AWS_ACCESS_KEY_ID }}"
          ACCT="${{ secrets.DEV_AWS_ACCOUNT_ID }}"
          REGION="${{ secrets.DEV_AWS_REGION }}"
          echo "ACCESS_KEY_ID: length=${#KEY}, last4=${KEY: -4}"
          echo "ACCOUNT_ID: length=${#ACCT}, last4=${ACCT: -4}"
          echo "REGION: value=${REGION}"
          echo "AMPLIFY_DEPLOYMENT set: ${{ secrets.AMPLIFY_DEPLOYMENT != '' }}"
          echo "NEXTAUTH_SECRET set: ${{ secrets.NEXTAUTH_SECRET != '' }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: CDK Bootstrap
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
            cdk bootstrap "aws://${{ secrets.DEV_AWS_ACCOUNT_ID }}/${{ secrets.DEV_AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
          AWS_DEFAULT_REGION="${{ secrets.DEV_AWS_REGION }}" \
            cdk deploy Janus-staging \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=staging" \
              --context "account=${{ secrets.DEV_AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.DEV_AWS_REGION }}"

      - name: Print deployment outputs
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-staging', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "
