name: Deploy Backend

on:
  push:
    branches:
      - development
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        if: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SC0RED

      - name: Configure SSH for private dependencies (fallback)
        if: steps.app-token.outcome != 'success'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}" > ~/.ssh/janus_deploy_key
          chmod 600 ~/.ssh/janus_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host github.com
            IdentityFile ~/.ssh/janus_deploy_key
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: |
          cd infrastructure
          pip install . --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: CDK Bootstrap
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
            cdk bootstrap "aws://${{ secrets.DEV_AWS_ACCOUNT_ID }}/${{ secrets.DEV_AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: CDK Deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
          AWS_DEFAULT_REGION="${{ secrets.DEV_AWS_REGION }}" \
            cdk deploy Janus-staging \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=staging" \
              --context "account=${{ secrets.DEV_AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.DEV_AWS_REGION }}"

      - name: Print deployment outputs
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-staging', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                      break
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "
