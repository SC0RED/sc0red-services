name: Deploy Development

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'scripts/e2e-cleanup.py'
      - '.github/workflows/deploy-backend.yml'

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/_ci-checks.yml
    secrets:
      DEPLOY_KEY: ${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}

  deploy:
    name: Deploy to Staging
    needs: ci
    runs-on: ubuntu-latest
    # Typical run is ~7 min (CDK bootstrap + deploy + outputs). 20-min
    # ceiling gives ~3× headroom and fails fast if a runner gets stuck
    # in the queue (default would be 6h, which can silently hang a deploy).
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
    outputs:
      frontend_url: ${{ steps.outputs.outputs.frontend_url }}
      # NOTE: we used to expose `user_pool_id` here, but Cognito User Pool
      # IDs are formatted as `<region>_xxxxx`, and the region prefix gets
      # masked because `DEV_AWS_REGION` is stored as a GitHub secret.
      # GitHub Actions then refuses to pass the masked value through
      # `needs.deploy.outputs` ("Skip output 'user_pool_id' since it may
      # contain secret"), silently skipping the cleanup job. The cleanup
      # job now uses the script's auto-discovery (`discover_user_pool_id`
      # in `scripts/e2e-cleanup.py`) instead of crossing this output.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install CDK CLI
        run: npm install -g aws-cdk --silent

      - name: Install CDK Python dependencies
        run: cd infrastructure && uv sync --quiet

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: CDK Bootstrap
        env:
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
            cdk bootstrap "aws://${{ secrets.DEV_AWS_ACCOUNT_ID }}/${{ secrets.DEV_AWS_REGION }}" \
            --quiet 2>&1 | grep -v "^$" || true

      - name: Encode deploy key for Docker bundling
        run: echo "DEPLOY_KEY_B64=$(printf '%s' "${{ secrets.SIGNALFIELD_CORE_DEPLOY_KEY }}" | base64 -w 0)" >> $GITHUB_ENV

      - name: CDK Deploy
        env:
          DEPLOY_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
          AMPLIFY_GITHUB_TOKEN: ${{ secrets.AMPLIFY_DEPLOYMENT }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
          AI_PROVIDER: openai
        run: |
          cd infrastructure
          CDK_ENVIRONMENT=staging \
          AWS_DEFAULT_REGION="${{ secrets.DEV_AWS_REGION }}" \
            cdk deploy Janus-staging \
              --require-approval never \
              --outputs-file /tmp/janus-outputs.json \
              --context "environment=staging" \
              --context "account=${{ secrets.DEV_AWS_ACCOUNT_ID }}" \
              --context "region=${{ secrets.DEV_AWS_REGION }}"

      - name: Extract deployment outputs
        id: outputs
        run: |
          python3 -c "
          import json, sys, os
          try:
              with open('/tmp/janus-outputs.json') as f:
                  outputs = json.load(f)
              stack = outputs.get('Janus-staging', {})
              for key, val in stack.items():
                  if 'ApiUrl' in key:
                      print(f'Backend API URL: {val}')
                  if 'AmplifyBranchUrl' in key:
                      print(f'Frontend URL: {val}')
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
                          gh.write(f'frontend_url={val}\n')
                  # `user_pool_id` is intentionally NOT exported to
                  # GITHUB_OUTPUT — see the comment on the deploy job's
                  # `outputs:` block. Cleanup auto-discovers from Cognito.
          except Exception as e:
              print(f'Could not read outputs: {e}', file=sys.stderr)
          "

  smoke:
    name: Smoke Tests
    needs: deploy
    if: needs.deploy.outputs.frontend_url != ''
    runs-on: ubuntu-latest
    # Typical run is ~5 min (browser install + 3 smoke specs). 15-min
    # ceiling fails fast if the runner pool is exhausted instead of
    # leaving the job queued indefinitely — that scenario produced a
    # stuck "queued forever" job on the 2026-05-15 dev deploy, marking
    # the whole run failed despite the deploy itself succeeding.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.frontend_url }}
        run: cd frontend && npx playwright test --project=smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: frontend/playwright-report/

  smoke-cleanup:
    name: Cleanup Test Data
    needs: [deploy, smoke]
    # Run on any deploy outcome — accumulated e2e users need cleanup
    # whether or not the most recent deploy succeeded. Auto-discovery
    # in `e2e-cleanup.py` exits cleanly if the pool isn't found (e.g.,
    # the very first deploy where the stack doesn't exist yet).
    if: always()
    runs-on: ubuntu-latest
    # Cleanup is a single boto3 script — usually 15-30 seconds. 5 min
    # ceiling is generous and prevents stuck-queued jobs from blocking
    # the run forever.
    timeout-minutes: 5
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEV_AWS_REGION }}

      - name: Run cleanup script
        # No --user-pool-id: the script auto-discovers via the
        # `janus-users-*` name pattern. Avoids the secret-masking issue
        # with cross-job outputs that previously skipped this step.
        run: |
          python3 scripts/e2e-cleanup.py \
            --table janus-staging \
            --region "${{ secrets.DEV_AWS_REGION }}"
