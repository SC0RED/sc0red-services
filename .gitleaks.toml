# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks

title = "sc0red Services Gitleaks Configuration"

# =============================================================================
# GLOBAL ALLOWLIST
# =============================================================================

[allowlist]
description = "Global allowlist for non-sensitive patterns"

paths = [
    '''\.gitleaks\.toml$''',
    '''\.pre-commit-config\.yaml$''',
    '''go\.sum$''',
    '''package-lock\.json$''',
    '''uv\.lock$''',
    '''\.github/.*\.ya?ml$''',
]

regexes = [
    '''example''',
    '''test''',
    '''dummy''',
    '''placeholder''',
    '''changeme''',
    '''your-.*-here''',
    '''xxx+''',
    '''fake''',
    '''sample''',
    '''mock''',
]

commits = []

# =============================================================================
# AWS RULES
# =============================================================================

[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["aws", "credentials", "key"]

[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws_?secret_?access_?key\s*[=:]\s*['\"]?([A-Za-z0-9/+=]{40})['\"]?'''
secretGroup = 1
tags = ["aws", "credentials", "secret"]

[[rules]]
id = "aws-session-token"
description = "AWS Session Token"
regex = '''(?i)aws_?session_?token\s*[=:]\s*['\"]?([A-Za-z0-9/+=]{100,})['\"]?'''
secretGroup = 1
tags = ["aws", "credentials", "token"]

# =============================================================================
# GENERIC SECRET RULES
# =============================================================================

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)\s*[=:]\s*['\"]?([A-Za-z0-9_\-]{20,})['\"]?'''
secretGroup = 2
tags = ["api", "key"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd)\s*[=:]\s*['\"]?([^\s'\"]{8,})['\"]?'''
secretGroup = 2
tags = ["secret", "password"]

[rules.allowlist]
description = "Allow code references to password/secret variables (not real secrets)"
paths = [
    '''backend/src/handlers/api_gateway_handler\.py$''',
    '''frontend/src/lib/auth/authOptions\.ts$''',
    '''frontend/src/lib/api/serverToken\.ts$''',
    '''docker-compose\.yml$''',
    '''scripts/e2e-test\.sh$''',
    '''\.env\.local\.example$''',
]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN\s*(?:RSA|EC|DSA|OPENSSH|PGP)?\s*PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "ssh-private-key"
description = "SSH Private Key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["ssh", "key", "private"]

# =============================================================================
# DATABASE & SERVICE URLS
# =============================================================================

[[rules]]
id = "database-url"
description = "Database Connection URL with credentials"
regex = '''(?i)(postgres|mysql|mongodb|redis)://[^:]+:[^@]+@[^\s]+'''
tags = ["database", "url", "credentials"]

# =============================================================================
# GITHUB & GIT
# =============================================================================

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[A-Za-z0-9_]{36}'''
tags = ["github", "token"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth Access Token"
regex = '''gho_[A-Za-z0-9_]{36}'''
tags = ["github", "oauth"]

[[rules]]
id = "github-app-token"
description = "GitHub App Token"
regex = '''(ghu|ghs)_[A-Za-z0-9_]{36}'''
tags = ["github", "app", "token"]

# =============================================================================
# JWT & TOKENS
# =============================================================================

[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '''eyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''
tags = ["jwt", "token"]

# =============================================================================
# OPENAI
# =============================================================================

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["openai", "key"]

# =============================================================================
# SLACK
# =============================================================================

[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'''
tags = ["slack", "webhook"]

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''
tags = ["slack", "token"]

# =============================================================================
# 1PASSWORD REFERENCES (ALLOWED)
# =============================================================================

[[rules]]
id = "1password-reference"
description = "1Password reference (allowed - not a secret)"
regex = '''op://[\w\-/]+'''
[rules.allowlist]
regexes = ['''.*''']
