[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-backend"
version = "0.1.0"
description = "Janus PE Risk Assessment — Python backend powered by signalfield-core"
authors = [{name = "SignalField Team"}]
requires-python = ">=3.12"
dependencies = [
    "signalfield-core[all] @ git+https://github.com/SignalField/signalfield-core.git@development",
    "pydantic>=2.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=0.45",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mangum>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "moto[dynamodb]>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "vulture>=2.11",
    "bandit>=1.7",
    "pip-audit>=2.0",
    "pre-commit>=3.0",
    "commitizen>=3.13",
    "boto3-stubs[dynamodb]>=1.34",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

# =============================================================================
# PYRIGHT - Strict Type Checking
# =============================================================================

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__"]
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"

# =============================================================================
# RUFF - Comprehensive Linting
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Custom rule codes from local scripts (prevent ruff from stripping # noqa comments for these)
external = ["NAMING001", "ABBREV001", "IMPORT001"]

select = [
    # Core
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade

    # Code quality
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "ERA",    # eradicate (commented-out code)
    "BLE",    # flake8-blind-except

    # Security
    "S",      # flake8-bandit (security checks in linting)

    # Modern Python
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "PERF",   # Performance anti-patterns
    "PTH",    # pathlib preference over os.path

    # Error handling (catches defensive patterns)
    "TRY",    # tryceratops (exception handling)
    "EM",     # error messages in exceptions

    # Function design
    "ARG",    # unused arguments
    "FBT",    # boolean-trap (boolean positional args)
    "PLR",    # pylint refactor (includes complexity)
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLW",    # pylint warning

    # Type checking related
    "TCH",    # type-checking imports
    "ANN",    # type annotations

    # Code hygiene
    "T20",    # flake8-print (no print statements)
    "PIE",    # misc lints
    "RSE",    # raise statements
    "RET",    # return statements
    "SLF",    # private member access
    "ICN",    # import conventions
    "PGH",    # pygrep-hooks
]

ignore = [
    # Docstrings - allow flexibility
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__

    # Type annotations - some flexibility
    "ANN401", # Dynamically typed expressions (Any) - handled by pyright

    # PEP 695 type parameters
    "UP046",  # Generic class uses Generic subclass instead of type parameters

    # Allow assert in tests (S101 is flake8-bandit assert)
    "S101",   # Use of assert - OK in tests, caught by per-file-ignores

    # Function complexity - handled by CodeRabbit with more context
    "PLR0913", # Too many arguments (>5)
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements

    # Sometimes needed for API compatibility
    "ARG002", # Unused method argument (sometimes needed for interface compliance)

    # Error messages - sometimes not practical
    "EM101",  # Exception must not use string literal
    "EM102",  # Exception must not use f-string literal

    # Try-except - some patterns are valid
    "TRY003", # Avoid specifying long messages outside exception class

    # Global statement - valid for singleton patterns
    "PLW0603", # Using the global statement

    # Boolean arguments - sometimes needed for API compatibility
    "FBT001", # Boolean-typed positional argument
    "FBT002", # Boolean default positional argument

    # Blind except - valid in scraping/IO code with proper logging
    "BLE001", # Do not catch blind exception: Exception

    # Import not at top of file - valid for deferred plugin imports
    "PLC0415", # import outside top-level

    # Private member access - sometimes needed for framework integration
    "SLF001", # Private member accessed
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # Assert allowed in tests
    "ARG",     # Unused args OK (fixtures)
    "PLR2004", # Magic values OK in tests
    "ANN",     # Type annotations optional in tests
    "D",       # Docstrings optional in tests
    "TCH",     # Type-checking imports OK at runtime in tests
]
"**/pipeline_steps/assess_risk.py" = ["E501"]     # LLM prompt strings
"**/pipeline_steps/extract_profile.py" = ["E501"] # LLM prompt strings
"**/pipeline_steps/generate_opportunities.py" = ["E501"] # LLM prompt strings
"**/scripts/**/*.py" = [
    "T20",     # Print allowed in scripts
    "S",       # Security checks less strict in scripts
    "ANN",     # Type annotations less strict in scripts
    "D",       # Docstrings optional in scripts
    "PTH",     # pathlib not required in scripts
    "TRY",     # try-except patterns relaxed in scripts
    "RUF012",  # Mutable class attributes OK in scripts
    "PGH003",  # Specific rule codes not required in scripts
    "PIE810",  # startswith/endswith tuple not required
    "E501",    # Line length relaxed in scripts
]

[tool.ruff.lint.extend-per-file-ignores]
# Security checks relaxed in test configs (moto credentials)
"**/conftest.py" = ["S105"]
# FastAPI needs Request at runtime (not just type-checking)
"**/local_server.py" = ["TCH002"]
# Boolean positional args OK in tests
"**/tests/**/*.py" = ["FBT003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pylint]
max-args = 5              # Flag functions with >5 args (use Pydantic models)
max-branches = 12         # Flag complex branching
max-returns = 6           # Flag multiple return statements
max-statements = 50       # Flag long functions

[tool.ruff.lint.flake8-type-checking]
strict = true             # Enforce TYPE_CHECKING imports

# =============================================================================
# VULTURE - Dead Code Detection
# =============================================================================

[tool.vulture]
exclude = ["src/models/"]
min_confidence = 80

# =============================================================================
# PYTEST + COVERAGE
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-fail-under=95 --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/local_server.py"]

# =============================================================================
# COMMITIZEN - Conventional Commits
# =============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:^version",
]
update_changelog_on_bump = true

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{subject}}"
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9-]+\\))?!?:\\s.+"
