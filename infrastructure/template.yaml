AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Janus PE Risk Assessment Backend

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  FrontendDomain:
    Type: String
    Default: "*"
    Description: Vercel domain for CORS
  NextAuthSecret:
    Type: String
    NoEcho: true
    Description: Shared secret for JWT validation (must match frontend NEXTAUTH_SECRET)
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for GPT-4o analysis

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 300
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref JanusTable
        STAGE: !Ref Stage

Resources:
  # ── DynamoDB ─────────────────────────────────────────────────────
  JanusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "janus-${Stage}"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
        - AttributeName: GSI4PK
          AttributeType: S
        - AttributeName: GSI4SK
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI4
          KeySchema:
            - AttributeName: GSI4PK
              KeyType: HASH
            - AttributeName: GSI4SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Lambda ───────────────────────────────────────────────────────
  JanusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "janus-${Stage}"
      Handler: src.handlers.handler.handler
      CodeUri: ../backend/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JanusTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnalysisQueue.QueueName
      Environment:
        Variables:
          ANALYSIS_QUEUE_URL: !Ref AnalysisQueue
          NEXTAUTH_SECRET: !Ref NextAuthSecret
          OPENAI_API_KEY: !Ref OpenAIApiKey
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref JanusApi
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalysisQueue.Arn
            BatchSize: 1

  # ── API Gateway ──────────────────────────────────────────────────
  JanusApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "janus-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${FrontendDomain}'"

  # ── SQS ──────────────────────────────────────────────────────────
  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "janus-analysis-queue-${Stage}"
      VisibilityTimeout: 600
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3

  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "janus-analysis-dlq-${Stage}"
      MessageRetentionPeriod: 1209600

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${JanusApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  TableName:
    Description: DynamoDB table name
    Value: !Ref JanusTable
  QueueUrl:
    Description: SQS analysis queue URL
    Value: !Ref AnalysisQueue
