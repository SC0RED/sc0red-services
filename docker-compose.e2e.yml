# docker-compose.e2e.yml — Integration test environment
#
# Extends the standard stack with:
#   - LocalStack  (SQS + DynamoDB instead of the standalone DynamoDB container)
#   - ai-mock     (mock AI HTTP server — no real API calls)
#   - worker      (SQS consumer that runs SQSHandler inside the backend image)
#
# Usage:
#   GH_TOKEN=$(gh auth token) docker compose -f docker-compose.e2e.yml up --build -d
#   BACKEND_URL=http://localhost:8001 ./scripts/e2e-test.sh
#   docker compose -f docker-compose.e2e.yml down -v

x-shared-env: &shared-env
  DYNAMODB_TABLE: sc0red-services-e2e
  DYNAMODB_ENDPOINT: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_ENDPOINT_URL: http://localstack:4566
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-minimum-32-characters-long}
  COGNITO_JWKS_URL: http://ai-mock:8080/.well-known/jwks.json
  COGNITO_CLIENT_ID: ""
  AI_PROVIDER: openai
  OPENAI_API_KEY: mock-key
  OPENAI_BASE_URL: http://ai-mock:8080/v1/
  ANALYSIS_QUEUE_URL: http://localstack:4566/000000000000/sc0red-services-analysis-e2e
  DOCUMENTS_BUCKET: sc0red-services-documents-e2e
  # The scan target in E2E is the internal ``ai-mock`` host (a private docker
  # address); disable the SSRF IP-range guard so the scraper can reach it.
  SCRAPER_ALLOW_PRIVATE_HOSTS: "true"

services:

  localstack:
    image: localstack/localstack:3
    container_name: sc0red-services-localstack-e2e
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb,s3
      DEBUG: "0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - localstack-e2e-data:/var/lib/localstack

  ai-mock:
    image: python:3.12-slim
    container_name: sc0red-services-ai-mock
    command: python /mock/mock_ai_server.py
    volumes:
      - ./scripts:/mock:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost',8080)); s.close()\""
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GH_TOKEN: ${GH_TOKEN:-}
    container_name: sc0red-services-backend-e2e
    ports:
      - "8001:8001"
    environment:
      <<: *shared-env
    depends_on:
      localstack:
        condition: service_healthy
      ai-mock:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')\" || exit 1"
      interval: 5s
      timeout: 5s
      retries: 15

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GH_TOKEN: ${GH_TOKEN:-}
    container_name: sc0red-services-worker-e2e
    command: ["python", "scripts/sqs_worker.py"]
    environment:
      <<: *shared-env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  localstack-e2e-data:
